spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/insurance
    username: insurance
    password: insurance

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  security:
    user:
      name: admin
      password: admin
      roles: ADMIN,BROKER

logging:
  level:
    root: INFO
    ro.insurance.buildinginsurance: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF