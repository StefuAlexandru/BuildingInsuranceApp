spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/insurance
    username: insurance
    password: insurance

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  task:
    scheduling:
      enabled: true

app:
  security:
    admin:
      username: ${APP_ADMIN_USER}
      password: ${APP_ADMIN_PASS}
    broker:
      username: ${APP_BROKER_USER}
      password: ${APP_BROKER_PASS}

logging:
  level:
    root: INFO
    ro.insurance.buildinginsurance: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF