spring:
  datasource:
    url: jdbc:h2:mem:insurance_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration-h2
  jpa:
    hibernate:
      ddl-auto: validate
  main:
    allow-bean-definition-overriding: true

app:
  security:
    jwt:
      secret: test-secret-please-change-1234567890-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ
      accessMinutes: 10
      refreshDays: 14
    admin:
      username: admin@email.com
      password: admin
    broker:
      password: broker

logging:
  level:
    root: WARN
    ro.insurance.buildinginsurance: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
