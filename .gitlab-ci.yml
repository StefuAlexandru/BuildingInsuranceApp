stages:
  - test
  - sonar

variables:
  GIT_DEPTH: "0"
  SONAR_PROJECT_KEY: "building-insurance"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: maven
  paths:
    - .m2/repository/

test:
  stage: test
  script:
    - |
        $ErrorActionPreference = "Stop"

        & .\mvnw.cmd -B -ntp clean verify jacoco:report
        if ($LASTEXITCODE -ne 0) { throw "Maven failed with exit code $LASTEXITCODE" }

        $xml = "target/site/jacoco/jacoco.xml"
        if (!(Test-Path $xml)) { throw "Missing $xml (JaCoCo n-a generat raportul)" }

        [xml]$j = Get-Content $xml
        $c = $j.report.counter | Where-Object { $_.type -eq "LINE" } | Select-Object -First 1
        if (-not $c) { $c = $j.report.counter | Where-Object { $_.type -eq "INSTRUCTION" } | Select-Object -First 1 }

        $miss  = [int]$c.missed
        $cover = [int]$c.covered
        $total = $miss + $cover
        $pct   = if ($total -eq 0) { 0 } else { [int]([math]::Round(100 * $cover / $total)) }

        Write-Output "Coverage: $pct%"
  coverage: '/Coverage:\s+(\d+)%/'
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/site/jacoco/
      - target/surefire-reports/
      - target/classes/
      - target/test-classes/

sonar:
  stage: sonar
  needs:
    - job: test
      artifacts: true
  script:
    - |
        $ErrorActionPreference = "Stop"

        if (-not $env:SONAR_HOST_URL) { throw "Missing SONAR_HOST_URL" }
        if (-not $env:SONAR_TOKEN) { throw "Missing SONAR_TOKEN" }

        # sanity check: SonarQube reachable
        iwr "$env:SONAR_HOST_URL/api/system/health" -UseBasicParsing | Out-String | Write-Host

        & .\mvnw.cmd -B -ntp sonar:sonar `
          "-Dsonar.projectKey=$env:SONAR_PROJECT_KEY" `
          "-Dsonar.host.url=$env:SONAR_HOST_URL" `
          "-Dsonar.token=$env:SONAR_TOKEN" `
          "-Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml"
        if ($LASTEXITCODE -ne 0) { throw "Sonar failed with exit code $LASTEXITCODE" }
