stages:
  - test

variables:
  GIT_DEPTH: "0"

test:
  stage: test
  script:
    - .\mvnw.cmd -B -ntp clean verify jacoco:report
    - |
      [xml]$x = Get-Content "target/site/jacoco/jacoco.xml"
      $c = $x.report.counter | Where-Object { $_.type -eq "LINE" } | Select-Object -First 1
      $missed = [int]$c.missed
      $covered = [int]$c.covered
      $pct = [math]::Round(100 * $covered / ($covered + $missed), 2)
      Write-Host "Coverage: $pct%"
  coverage: '/Coverage:\s+(\d+(\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/site/jacoco/
      - target/surefire-reports/
