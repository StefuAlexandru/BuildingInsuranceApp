stages:
  - test
  - sonar

variables:
  GIT_DEPTH: "0"
  SONAR_PROJECT_KEY: "building-insurance"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"

before_script:
  - git config --global --add safe.directory "$CI_PROJECT_DIR"

cache:
  key: maven
  paths:
    - .m2/repository/
    - .sonar/cache/

test:
  stage: test
  script:
    - |
        $ErrorActionPreference = "Stop"


        $env:JAVA_HOME = "C:\Program Files\Java\jdk-21"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        Write-Host "JAVA_HOME=$env:JAVA_HOME"
        where java
        java -version


        & .\mvnw.cmd -B -ntp clean verify
        if ($LASTEXITCODE -ne 0) { throw "Maven failed with exit code $LASTEXITCODE" }

        $xml = "target/site/jacoco/jacoco.xml"
        if (!(Test-Path $xml)) { throw "Missing $xml (JaCoCo n-a generat raportul)" }

        [xml]$j = Get-Content $xml
        $c = $j.report.counter | Where-Object { $_.type -eq "LINE" } | Select-Object -First 1
        if (-not $c) { $c = $j.report.counter | Where-Object { $_.type -eq "INSTRUCTION" } | Select-Object -First 1 }

        $miss  = [int]$c.missed
        $cover = [int]$c.covered
        $total = $miss + $cover
        $pct   = if ($total -eq 0) { 0 } else { [int]([math]::Round(100 * $cover / $total)) }

        Write-Output "Coverage: $pct%"
  coverage: '/Coverage:\s+(\d+)%/'
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/site/jacoco/
      - target/surefire-reports/
      - target/classes/
      - target/test-classes/

sonar:
  stage: sonar
  needs:
    - job: test
      artifacts: true
  script:
    - |
        $ErrorActionPreference = "Stop"

        $env:JAVA_HOME = "C:\Program Files\Java\jdk-21"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        Write-Host "JAVA_HOME=$env:JAVA_HOME"
        where java
        java -version

        if (-not $env:SONAR_HOST_URL) { throw "Missing SONAR_HOST_URL" }
        if (-not $env:SONAR_TOKEN) { throw "Missing SONAR_TOKEN (check CI/CD variable scope/protection)" }

        # Optional check (non-fatal), with auth to avoid 403
        try {
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$($env:SONAR_TOKEN):"))
          $headers = @{ Authorization = "Basic $basic" }
          $ver = (iwr "$env:SONAR_HOST_URL/api/server/version" -Headers $headers -UseBasicParsing).Content
          Write-Host "SonarQube reachable, version: $ver"
        } catch {
          Write-Host "SonarQube check skipped: $($_.Exception.Message)"
        }

        & .\mvnw.cmd -B -ntp sonar:sonar `
          "-Dsonar.projectKey=$env:SONAR_PROJECT_KEY" `
          "-Dsonar.host.url=$env:SONAR_HOST_URL" `
          "-Dsonar.token=$env:SONAR_TOKEN" `
          "-Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml"
        if ($LASTEXITCODE -ne 0) { throw "Sonar failed with exit code $LASTEXITCODE" }
